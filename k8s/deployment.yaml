---
apiVersion: v1
kind: Service
metadata:
  name: telcel-ai-service
  namespace: default
  annotations:
    oci.oraclecloud.com/load-balancer-type: "nlb"
    oci-network-load-balancer.oraclecloud.com/internal: "true"
    oci-network-load-balancer.oraclecloud.com/subnet: "ocid1.subnet.oc1.mx-monterrey-1.aaaaaaaaihh6ja6hhvh4nzujzrcerdv3ik5qk5vrkzjzpzxl7bfxuezidtea"
spec:
  type: LoadBalancer
  selector:
    app: telcel-ai-app
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080
