              value: "true"
            - name: LANGSMITH_API_KEY
              value: "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"
            # Private
            - name: PRIVATE_KEY
              value: "LfBchliYEiCZhnkS_TbJjZXBRHs0pLSA6ZBtlheMQ8Y="
