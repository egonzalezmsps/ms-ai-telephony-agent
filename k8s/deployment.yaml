apiVersion: v1
kind: Service
metadata:
  name: telcel-ai-service
  namespace: default
  annotations:
    oci.oraclecloud.com/load-balancer-type: "nlb"
    oci-network-load-balancer.oraclecloud.com/internal: "true"
    oci-network-load-balancer.oraclecloud.com/subnet: "ocid1.subnet.oc1.us-chicago-1.aaaaaaaa42x4zrjbrcvk6ycknucde3kiqfqpo66qn7prlhwi5o5rr2wdv6wq"
    oci-network-load-balancer.oraclecloud.com/nsg-ids: "ocid1.networksecuritygroup.oc1.us-chicago-1.aaaaaaaacvwtakshz5m27j6bu5r2h3u255mlejnepnqesfrm2fuuxym4ev3a"
spec:
  type: LoadBalancer
  selector:
    app: telcel-ai-app
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080