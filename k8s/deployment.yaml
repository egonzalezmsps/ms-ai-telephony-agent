
apiVersion: apps/v1
kind: Deployment
metadata:
  name: telcel-ai-deployment
  labels:
    app: telcel-ai-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: telcel-ai-app
  template:
    metadata:
      labels:
        app: telcel-ai-app
    spec:
      imagePullSecrets:
        - name: ocir-secret
      volumes:
        - name: oci-key
          configMap:
            name: oci-api-key-config
      containers:
        - name: telcel-ai-app
          image: mx-monterrey-1.ocir.io/axrmvrmnextg/orion-telcel-ai-app:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: oci-key
              mountPath: /app/.oci
              readOnly: true
          env:
            # OCI - no sensibles, se dejan como valor plano
            - name: OCI_GENAI_ENDPOINT
              value: "https://inference.generativeai.us-chicago-1.oci.oraclecloud.com"
            - name: OCI_REGION
              value: "us-chicago-1"
            - name: OCI_MODEL_ID
              value: "google.gemini-2.5-flash"
            - name: OCI_SERVICE_ENDPOINT
              value: "https://inference.generativeai.us-chicago-1.oci.oraclecloud.com"
            - name: OCI_COMPARTMENT_ID
              value: "ocid1.compartment.oc1..aaaaaaaas4ruomqblntlmwt76xqkam4efboqcvlnae3o5m22ao4ja4en5ooa"
            - name: OCI_USER
              value: "ocid1.user.oc1..aaaaaaaahlpvonwo7kosxnyamrgu2mmh5ykwnzqz4rtxu5cwsphj2efddx7a"
            - name: OCI_TENANCY
              value: "ocid1.tenancy.oc1..aaaaaaaap5s754zivtxd3uwmpoflh3wpgily2tsnerjys4fx55mxp7ahn6kq"
            - name: OCI_FINGERPRINT
              value: "8e:64:9f:d0:bc:46:1b:25:0c:ca:f0:60:98:91:34:d4"
            - name: OCI_KEY_FILE
              value: "/app/.oci/oci_api_key.pem"
            - name: OCI_ENABLE_STREAMING
              value: "False"
            # LLM
            - name: LLM_TEMPERATURE
              value: "0.3"
            - name: LLM_MAX_TOKENS
              value: "600"
            # PostgreSQL / sesiones
            - name: DATABASE_URL
              value: "postgresql://pgadmin:Or4#D3Sytem-@10.0.10.166:5432/reni_agent"
            - name: SESSION_TTL_HOURS
              value: "24"
            # Redis
            - name: REDIS_HOST
