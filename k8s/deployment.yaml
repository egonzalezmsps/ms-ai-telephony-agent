apiVersion: apps/v1
kind: Deployment
metadata:
  name: telcel-ai-deployment
  labels:
    app: telcel-ai-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: telcel-ai-app
  template:
    metadata:
      labels:
        app: telcel-ai-app
    spec:
      imagePullSecrets:
        - name: ocir-secret
      volumes:
        - name: oci-key
          secret:
            secretName: oci-api-key-secret
      containers:
        - name: telcel-ai-app
          image: us-chicago-1.ocir.io/idkrobdezpcz/orion-telcel-ai-app:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: oci-key
              mountPath: /app/.oci
              readOnly: true
          env:
            # OCI
            - name: OCI_GENAI_ENDPOINT
              value: "https://inference.generativeai.us-chicago-1.oci.oraclecloud.com"
            - name: OCI_REGION
              value: "us-chicago-1"
            - name: OCI_MODEL_ID
              value: "meta.llama-4-maverick-17b-128e-instruct-fp8"
            - name: OCI_SERVICE_ENDPOINT
              value: "https://inference.generativeai.us-chicago-1.oci.oraclecloud.com"
            - name: OCI_COMPARTMENT_ID
              value: "ocid1.compartment.oc1..aaaaaaaai33jw7xmwiyb2mv46l3iqodceic5a745b35f2t4jvzucjzv4db6q"
            - name: OCI_USER
              value: "ocid1.user.oc1..aaaaaaaayx7oyqsdnvn7q5awv3g4p7hydliz6wkpgiktcude33vkf4vgyv4a"
            - name: OCI_TENANCY
              value: "ocid1.tenancy.oc1..aaaaaaaaactlpis3qfncvojaodoosit4mwklptaxqp6pjjeynllfojbfc4lq"
            - name: OCI_FINGERPRINT
              value: "15:73:5c:d0:47:6b:aa:a8:e4:61:60:2f:bc:13:f1:a0"
            - name: OCI_KEY_FILE
              value: "/app/.oci/oci_api_key.pem"
            - name: OCI_ENABLE_STREAMING
              value: "False"
            # LLM
            - name: LLM_TEMPERATURE
              value: "0.3"
            - name: LLM_MAX_TOKENS
              value: "600"
            # PostgreSQL
            - name: DATABASE_URL
              value: "postgresql://postgres:enoc@207.211.162.169:5432/reni_agent"
            - name: SESSION_TTL_HOURS
              value: "24"
            # Redis
            - name: REDIS_HOST
              value: "aaauwo7dsya3u3vi5yvwqeuzv6uh646zwukqjru7nrnpr2hy4xqgznq-p.redis.us-chicago-1.oci.oraclecloud.com"
            - name: REDIS_PORT
