[project]
name = "reni-strands-agent"
version = "0.1.0"
description = "ReniAgent — Telcel sales agent built with Strands Agents + OCI Generative AI"
requires-python = ">=3.11"
dependencies = [
    "strands-agents>=0.1.0",
    "strands-agents-tools>=0.1.0",
    "litellm>=1.40.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "oci>=2.100.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "streamlit>=1.35.0",
    "orjson>=3.9.0",
    "pycryptodome>=3.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "ruff==0.16.6"
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "BLE",
    "C4",
    "SIM",
    "RUF",
]
# Caracteres Unicode intencionales en textos en español (no son typos de ASCII)
allowed-confusables = ["×", "–", "➕"]

[tool.ruff.lint.per-file-ignores]
# Los scripts ajustan sys.path / cargan .env antes de importar módulos de app
# y son harnesses de prueba que registran cualquier excepción como fallo
"scripts/*.py" = ["E402", "BLE001"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
