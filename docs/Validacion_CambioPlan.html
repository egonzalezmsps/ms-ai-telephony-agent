* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; }

.leaf { background: var(--paper); min-width: 0; height: 780px; display: flex; flex-direction: column; position: relative; }

.hero-num { font-family: var(--f-display); font-weight: 800; font-size: clamp(30px, 3vw, 38px); line-height: 1; letter-spacing: .01em; font-variant-numeric: tabular-nums; }

/* Panel 3 · hallazgos y log */
.finds { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }

.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }

.csv { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }

const csvRow = (c) => ["5664828978", "Enoc", "SPS", CSV_PLAN[c.n][0], c.tipo, CSV_PLAN[c.n][1], "REGISTRADO", "nuevo", c.msisdn];

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const money = (v) => "$" + v.toLocaleString("en-US");
const sevLabel = { alta: "Alta", media: "Media", baja: "Baja", ok: "OK" };
const split = (m) => [m.slice(0, 2), m.slice(2, 6), m.slice(6)];

function renderHome() {
  document.getElementById("numbers").innerHTML = CASES.map((c) => {
    const [a, b, d] = split(c.msisdn);
    return `<button class="num" type="button" data-n="${c.n}" aria-label="Caso ${c.n}: línea ${c.msisdn}">
      <span class="n">${c.n}</span><span class="dot${c.pending ? " pend" : ""}"></span>
      <span class="digits"><span class="area">${a}</span> ${b} ${d}</span>
    </button>`;
  }).join("");
}

function bubble(b) {
  const time = `<span class="time">${b.t || "&nbsp;"}</span>`;
  const notes = (b.ok ? `<span class="flag ok">✓ ${esc(b.ok)}</span>` : "") + (b.f ? `<span class="flag">⚑ ${esc(b.f)}</span>` : "");
  const tag = b.reply ? `<span class="reply-tag">Botón de respuesta</span>` : "";
  let html = `<div class="msg ${b.s}">${tag}${esc(b.m)}${notes}${time}</div>`;
  if (b.btn) html += `<div class="btns">${b.btn.map((x) => `<span>${esc(x)}</span>`).join("")}</div>`;
  return html;
}

function rulesFor(c) {
  const r = [
    ["Modalidad tomada del CSV", `${c.tipo} → ${c.mod}`],
    ["Línea enviada a Telcel (lineaApi)", `msisdn: ${c.msisdn}`],
    [c.otp ? "Pide código porque el precio sube" : "Sin código: precio igual a la renta", c.otp ? `otpAuth: true · SEND_OTP enviado` : `otpAuth: false · sin SEND_OTP`],
    [`Código de producto ${c.mod}`, `id: ${c.pid}`],
    ["Mismo proceso en API 1 y API 3", c.proc],
    [c.otp ? "Código del cliente en la orden" : "Orden sin código", `otpAuth: ${c.otp ? c.code : "NA"}`],
  ];
  if (c.fam) r.splice(2, 0, ["Cambio de familia Ultra → Libre", "aceptado"]);
  return r;
}

function renderCase(n) {

      <span class="spacer"></span>
      <span class="pos">Caso ${c.n} de 6</span>
      <button type="button" id="prev" ${c.n === 1 ? "disabled" : ""} aria-label="Caso anterior">←</button>

    </div>
    <div class="tri">
      <article class="leaf chatleaf" aria-label="Conversación">
        <div class="leaf-head"><span class="label">Panel 1</span><h3>La conversación</h3></div>
        <div class="leaf-body">

          <div class="chat"><span class="day">4 de noviembre de 2026</span>${c.chat.map(bubble).join("")}</div>
        </div>
      </article>
      <article class="leaf" aria-label="Caso y reglas">
        <div class="leaf-head"><span class="label">Panel 2</span><h3>El cambio y sus reglas</h3></div>
        <div class="leaf-body">
          <div style="display:grid;gap:10px">

          </div>
          <div class="move">
            <div class="box"><span class="label">Plan actual</span><b>${esc(c.fromPlan)}</b><span>${money(c.fromPrice)}</span></div>
            <span class="arrow" aria-hidden="true">→</span>
            <div class="box to"><span class="label">Plan nuevo</span><b>${esc(c.toPlan)}</b><span>${money(c.toPrice)}</span></div>
          </div>
          <dl class="facts">
            <div><dt>Modalidad</dt><dd>${c.tipo} → ${c.mod}</dd></div>
            <div><dt>product_id</dt><dd>${c.pid}</dd></div>

            <div><dt>Cashback</dt><dd>${c.cb}</dd></div>
            <div><dt>Código SMS</dt><dd>${c.otp ? "Sí · " + c.code : "No · NA"}</dd></div>
            <div><dt>Orden</dt><dd>${c.order}</dd></div>
          </dl>
          <div style="display:grid;gap:6px">
            <span class="label">CSV cargado en la campaña</span>
            <div class="csv">
              <div class="csv-head"><span class="mono" style="font-size:12px;color:var(--muted)">1 fila · 9 columnas</span><button type="button" id="copycsv">Copiar CSV</button></div>
              <dl class="csv-fields">${CSV_HEAD.split(",").map((k, i) => `<dt>${k}</dt><dd${CSV_NOTE[k] ? ' class="key"' : ""}>${esc(csvRow(c)[i])}${CSV_NOTE[k] ? ` <span style="color:var(--muted);font-weight:400">· ${CSV_NOTE[k]}</span>` : ""}</dd>`).join("")}</dl>
              <pre class="csv-raw" id="csvraw">${esc(CSV_HEAD + "\n" + csvRow(c).join(","))}</pre>
            </div>
          </div>
          <div style="display:grid;gap:6px">
            <span class="label">Reglas aplicadas · ${rules.length} de ${rules.length} correctas</span>
            <ul class="rules">${rules.map(([a, b]) => `<li><span class="tick" aria-label="Correcto">✓</span><span><b>${esc(a)}</b><code>${esc(b)}</code></span></li>`).join("")}</ul>
          </div>
        </div>
      </article>
      <article class="leaf" aria-label="Hallazgos y log">
        <div class="leaf-head"><span class="label">Panel 3</span><h3>Hallazgos y log</h3></div>
        <div class="leaf-body">
          <div style="display:grid;gap:10px">
            <span class="label">Hallazgos · ${c.finds.length}</span>
            <ul class="finds">${c.finds.map(([s, t]) => `<li><span class="sev ${s}">${sevLabel[s]}</span><span>${esc(t)}</span></li>`).join("")}</ul>
          </div>
          <div style="display:grid;gap:6px">
            <span class="label">Log del ambiente · UTC · APIs simuladas</span>
            <ol class="steps">${c.log.map(([t, k, v]) => `<li><span class="t">${esc(t)}</span><span><span class="k">${esc(k)}</span><span class="v">${esc(v)}</span></span></li>`).join("")}</ol>
          </div>
          ${c.pending ? `<p class="note">⚑ ${esc(c.pending)}.</p>` : ""}
        </div>
      </article>
    </div>`;
  const copyBtn = el.querySelector("#copycsv");
  copyBtn.onclick = () => {
    const text = CSV_HEAD + "\n" + csvRow(c).join(",");
    const done = () => { copyBtn.textContent = "Copiado"; setTimeout(() => { copyBtn.textContent = "Copiar CSV"; }, 1600); };
    const fallback = () => { const r = document.createRange(); r.selectNodeContents(el.querySelector("#csvraw")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); copyBtn.textContent = "Texto seleccionado"; };
    try { navigator.clipboard.writeText(text).then(done, fallback); } catch (e) { fallback(); }
  };
  el.querySelector("#back").onclick = () => { location.hash = ""; };
  el.querySelector("#prev").onclick = () => { location.hash = "caso-" + (c.n - 1); };
  el.querySelector("#next").onclick = () => { location.hash = "caso-" + (c.n + 1); };
}

function route() {
  const m = /^#caso-([1-6])$/.exec(location.hash);
  const home = document.getElementById("home"), cs = document.getElementById("case");
  if (m) { renderCase(Number(m[1])); home.hidden = true; cs.hidden = false; window.scrollTo(0, 0); }
  else { cs.hidden = true; home.hidden = false; }
}

document.getElementById("numbers").addEventListener("click", (e) => {
  const b = e.target.closest(".num");
  if (b) location.hash = "caso-" + b.dataset.n;
});
window.addEventListener("hashchange", route);
renderHome();
route();
